name: Android APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK o'rnatish
        uses: android-actions/setup-android@v3

      - name: Android litsenziyalarini qabul qilish
        run: yes | sdkmanager --licenses || true

      - name: Bog'liqliklarni o'rnatish
        run: npm install --legacy-peer-deps

      - name: Native Android loyihasini generatsiya qilish
        run: npx expo prebuild --platform android --no-install

      - name: Gradle xotirasini sozlash
        working-directory: android
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "newArchEnabled=false" >> gradle.properties
          echo "hermesEnabled=true" >> gradle.properties

      - name: Gradle bilan APK yig'ish
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK faylini saqlash
        uses: actions/upload-artifact@v4
        with:
          name: pinduado-uzbek-overlay-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
